<!DOCTYPE html>
<html>
  <html lang="en">
    <head>
      
      <style type="text/css">
        body {
          background-color: #0ce9cc;
        }
      #header {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
font-weight: 500;
        color: #071a22;
        padding: 20px;
        text-align: center;
      }
      h2 {
        color: #1c5964;
      }
      #content {
        font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif;
font-weight: 500;
        padding: 20px;
        text-align: center;
      }
          #result {
            font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif;
font-weight: 500;
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0 30px;
      min-height: 1.2em;
    }
    #pickers {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    select, button {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
font-weight: 500;
      font-size: 18px;
      padding: 8px 12px;
      border: 1px solid #000;
      background: #9cffef;
      color: #221919;
    }
    button {
      background: #000;
      color: #eee;
      cursor: pointer;
      padding: 10px 40px;
      border: none;
      border-radius: 2px;
    }
    button:focus-visible, select:focus-visible {
      outline: 1px solid #071a22;
      outline-offset: 3px;
    }
    #error {
      color: #7a0000;
      margin-top: 20px;
    }
    #result-wrap {
      position: relative;
      display: inline-block;
    }
    #overlay {
      position: absolute;
      top: -80px;
      left: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      object-fit: contain;
      pointer-events:none;
    }
    fieldset {
      border: none;
      padding: 0;
    }
    legend {
      padding: 0;
      margin-bottom: 6px;
    }
    .btn {
      cursor: pointer;
      transition: color 0.3s ease; /* Smooth fade */
    }
    .btn:hover {
    color: #2e9cdb; /* Darker blue on hover */
  }

  </style>
</head>
<body>
  <div id="header">
    <h1>Silly Name Generator</h1>
    <h2>Start your silly future today!</h2>
  </div>
 
  <div id="content">
    <div id="result-wrap">
      <div id="result" aria-live="polite">sillybuddy445</div>
      <img id="overlay" src="explosion.gif" alt="" hidden>
    </div>
    
 
    <div id="pickers">
      <fieldset>
        <legend>First word</legend>
        <select id="first-word">
          <option value="static:silly" selected>silly</option>
          <option value="silly-adjectives.txt">silly synonym</option>
          <option value="rand-adjectives.txt">random adjective</option>
        </select>
      </fieldset>
 
      <fieldset>
        <legend>Second word</legend>
        <select id="second-word">
          <option value="static:buddy" selected>buddy</option>
          <option value="buddy-syns.txt">buddy synonym</option>
          <option value="nouns.txt">random noun</option>
        </select>
      </fieldset>
 
      <fieldset>
        <legend>Number</legend>
        <select id="number">
          <option value="static:445" selected>445</option>
          <option value="random">random</option>
        </select>
      </fieldset>
    </div>
    
    <button class="btn" id="generate" type="button">Generate</button>

    <p id="error"></p>
  </div>
 
  <script>
    const cache = {};
 
    // Loads a .txt file (one word per line) and remembers it
    async function loadList(file) {
      if (!cache[file]) {
        const response = await fetch(file);
        if (!response.ok) throw new Error("Could not load " + file);
        const text = await response.text();
        cache[file] = text
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(line => line.length > 0);
      }
      return cache[file];
    }
 
    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }
 
    // Returns the word for one radio group: either a fixed word or a random one from a file
    async function getWord(selectId) {
      const choice = document.getElementById(selectId).value;
      if (choice.startsWith("static:")) {
        return choice.slice("static:".length);
      }
      return pickRandom(await loadList(choice));
    }
 
    document.getElementById("generate").addEventListener("click", async () => {
      const error = document.getElementById("error");
      error.textContent = "";
 
      try {
        const first = await getWord("first-word");
        const second = await getWord("second-word");
 
        const numberChoice = document.getElementById("number").value;
        const number = numberChoice.startsWith("static:")
          ? numberChoice.slice("static:".length)
          : String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");
 
        document.getElementById("result").textContent =
          first + "" + second + "" + number;
        playOverlay();
      } catch (e) {
        error.textContent =
          "Couldn't load the word lists. If you opened this file directly, " +
          "run a local server in this folder instead (see instructions).";
      }
    });

    function playOverlay() {
      const gif = document.getElementById("overlay");

      clearTimeout(playOverlay.timer);
      gif.hidden = false;

      gif.onload = () => {
        gif.hidden = false;
        playOverlay.timer = setTimeout(() => {
        gif.hidden = true;
      }, 700);
      };

      gif.src = "explosion.gif?" + Date.now();
    }
  </script>
</body>
</html>
